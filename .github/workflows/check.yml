# SPDX-License-Identifier: MIT
#
# Runs the flake's checks on pushes to main and on pull requests. The
# checks build both test fixtures in the Nix sandbox from their lockfiles
# (fixed-output fetches from the npm registry, codeload.github.com,
# registry.yarnpkg.com and salsa.debian.org), run what they build, and
# publish a fixture's tarball to a registry on the loopback interface.
# The second step evaluates every check for every system the flake
# lists, without building.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Build and run the checks
        run: nix flake check -L
      - name: Evaluate the checks for every system
        run: nix flake check --all-systems --no-build
